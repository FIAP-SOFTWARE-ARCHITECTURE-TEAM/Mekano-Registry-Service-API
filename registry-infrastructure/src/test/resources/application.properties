# Perfil de teste do modulo infrastructure: H2 em memoria no modo PostgreSQL.
# Evita dependencia de Docker/Testcontainers no build local e no CI.
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:registry_infra;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false

quarkus.flyway.migrate-at-start=false
quarkus.flyway.repair-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=false
