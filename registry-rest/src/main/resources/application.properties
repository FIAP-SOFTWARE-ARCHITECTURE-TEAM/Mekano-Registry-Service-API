# Mekano Registry - configuracao principal (dev/prod)
quarkus.http.port=8081
quarkus.rest.path=/api/v4

# Datasource PostgreSQL (variaveis usadas pelo docker-compose e .env.example)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${REGISTRY_DB_URL:jdbc:postgresql://localhost:5433/mekano_registry}
quarkus.datasource.username=${REGISTRY_DB_USER:mekano}
quarkus.datasource.password=${REGISTRY_DB_PASSWORD:mekano}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20

# Schema gerenciado exclusivamente pelo Flyway
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true

# Health e metricas
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# CORS permissivo para desenvolvimento local
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Logs
quarkus.log.level=INFO
quarkus.log.category."com.fiap.mekano".level=INFO
